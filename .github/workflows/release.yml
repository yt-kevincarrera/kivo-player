name: Release APKs

# Publishes downloadable APKs whenever a version tag is pushed, e.g.:
#   git tag v1.0.1 && git push origin v1.0.1
# Uses the in-Actions GITHUB_TOKEN (which has write access), so it works
# regardless of which account pushed the tag.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The notes below diff against the previous tag, which a shallow
          # clone does not have.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.8
          channel: stable
          cache: true

      - run: flutter pub get

      # Sign with the project's real release key so every build — CI or local —
      # shares one signature. Android rejects an update whose signature changed,
      # so this is what makes the in-app updater able to install over itself.
      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing — refusing to publish a debug-signed release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/kivo-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=kivo
          storeFile=kivo-release.jks
          EOF

      - run: flutter build apk --release --split-per-abi

      - name: Scrub the signing material
        if: always()
        run: rm -f android/app/kivo-release.jks android/key.properties

      - name: Name the APKs after the tag
        run: |
          cd build/app/outputs/flutter-apk
          v="${GITHUB_REF_NAME}"
          mv app-arm64-v8a-release.apk   "kivo-${v}-arm64-v8a.apk"
          mv app-armeabi-v7a-release.apk "kivo-${v}-armeabi-v7a.apk"
          mv app-x86_64-release.apk      "kivo-${v}-x86_64.apk"

      # GitHub's own generated notes list merged PRs. For a repo that has been
      # pushing straight to master that list is empty, which is why every
      # release so far said nothing but "Full Changelog: <link>". The commit
      # subjects ARE the changelog here, so build the notes from those — the
      # in-app updater shows this text, and a link is no use inside a dialog.
      - name: Build the release notes from the commits
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          RANGE="${GITHUB_REF_NAME}"
          if [ -n "$PREV" ]; then RANGE="${PREV}..${GITHUB_REF_NAME}"; fi
          ITEMS=$(git log --no-merges --pretty=format:'%s' "$RANGE" \
            | grep -Ev '^(chore|docs|test|ci|build|style)(\(|:)' \
            | sed -E 's/^(feat|fix|refactor|perf)(\(([^)]+)\))?: */- /' \
            || true)
          {
            echo "## Novedades"
            echo
            if [ -n "$ITEMS" ]; then
              echo "$ITEMS"
            else
              echo "- Mejoras internas y correcciones"
            fi
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/kivo-*.apk
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true

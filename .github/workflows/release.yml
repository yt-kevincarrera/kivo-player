name: Release APKs

# Publishes downloadable APKs whenever a version tag is pushed, e.g.:
#   git tag v1.0.1 && git push origin v1.0.1
# Uses the in-Actions GITHUB_TOKEN (which has write access), so it works
# regardless of which account pushed the tag.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The notes below diff against the previous tag, which a shallow
          # clone does not have.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.8
          channel: stable
          cache: true

      - run: flutter pub get

      # Sign with the project's real release key so every build — CI or local —
      # shares one signature. Android rejects an update whose signature changed,
      # so this is what makes the in-app updater able to install over itself.
      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing — refusing to publish a debug-signed release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/kivo-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=kivo
          storeFile=kivo-release.jks
          EOF

      - run: flutter build apk --release --split-per-abi

      - name: Scrub the signing material
        if: always()
        run: rm -f android/app/kivo-release.jks android/key.properties

      - name: Name the APKs after the tag
        run: |
          cd build/app/outputs/flutter-apk
          v="${GITHUB_REF_NAME}"
          mv app-arm64-v8a-release.apk   "kivo-${v}-arm64-v8a.apk"
          mv app-armeabi-v7a-release.apk "kivo-${v}-armeabi-v7a.apk"
          mv app-x86_64-release.apk      "kivo-${v}-x86_64.apk"

      - name: Test the delta codec
        run: python3 -B -m unittest discover -s scripts -p test_update_delta.py

      - name: Build verified partial updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/update-bases build/update-base-downloads build/update-assets
          # An unavailable old release only disables its patch. Every target
          # still gets a full-APK hash and size in the manifest.
          if gh release list --limit 10 --exclude-drafts --exclude-pre-releases \
            --json tagName --jq '.[].tagName' > build/update-tags.txt; then
            count=0
            while IFS= read -r tag; do
              [ "$tag" = "$GITHUB_REF_NAME" ] && continue
              [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
              mkdir -p "build/update-base-downloads/$tag"
              if gh release download "$tag" --pattern '*.apk' \
                --dir "build/update-base-downloads/$tag"; then
                mv "build/update-base-downloads/$tag" "build/update-bases/$tag"
              else
                echo "::warning::Could not download all APKs for $tag; unavailable bases will be skipped."
              fi
              count=$((count + 1))
              [ "$count" -ge 2 ] && break
            done < build/update-tags.txt
          else
            echo "::warning::Previous releases unavailable; publishing full-APK metadata only."
          fi
          version_build=$(awk '/^version:/ {print $2}' pubspec.yaml)
          IFS='+' read -r version code <<< "$version_build"
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo 'Tag and app version differ'; exit 1; }
          python3 -B scripts/update_delta.py generate \
            --base-dir build/update-bases \
            --target-dir build/app/outputs/flutter-apk \
            --output-dir build/update-assets \
            --apk-metadata build/app/outputs/apk/release/output-metadata.json \
            --version "$version" --version-code "$code"

      - name: Test Android update verification
        env:
          KIVO_DELTA_MANIFEST: ${{ github.workspace }}/build/update-assets/kivo-update-v1.json
          KIVO_DELTA_BASE_DIR: ${{ github.workspace }}/build/update-bases
          KIVO_DELTA_TARGET_DIR: ${{ github.workspace }}/build/app/outputs/flutter-apk
        run: |
          cd android
          ./gradlew :app:testReleaseUnitTest -Psplit-per-abi=true -Ptarget-platform=android-arm,android-arm64,android-x64

      # GitHub's own generated notes list merged PRs. For a repo that has been
      # pushing straight to master that list is empty, which is why every
      # release so far said nothing but "Full Changelog: <link>". The commit
      # subjects ARE the changelog here, so build the notes from those — the
      # in-app updater shows this text, and a link is no use inside a dialog.
      - name: Build the release notes from the commits
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          RANGE="${GITHUB_REF_NAME}"
          if [ -n "$PREV" ]; then RANGE="${PREV}..${GITHUB_REF_NAME}"; fi
          ITEMS=$(git log --no-merges --pretty=format:'%s' "$RANGE" \
            | grep -Ev '^(chore|docs|test|ci|build|style)(\(|:)' \
            | sed -E 's/^(feat|fix|refactor|perf)(\(([^)]+)\))?: */- /' \
            || true)
          {
            echo "## Novedades"
            echo
            if [ -n "$ITEMS" ]; then
              echo "$ITEMS"
            else
              echo "- Mejoras internas y correcciones"
            fi
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/kivo-*.apk
            build/update-assets/*
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
